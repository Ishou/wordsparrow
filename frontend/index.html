<!doctype html>
<html lang="fr">
  <head>
    <script>
      // ADR-0088: resolve bliss.theme before first paint so dark never flashes light.
      (function () { try { var t = localStorage.getItem('bliss.theme'); var dark = t === 'sombre' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; } })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#CDE9DA" />
    <!-- ADR-0089: warm DNS+TCP+TLS to the two critical API origins; auth pool is credentialed. -->
    <link rel="preconnect" href="https://api.wordsparrow.io" crossorigin />
    <link rel="preconnect" href="https://auth.wordsparrow.io" crossorigin="use-credentials" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
  </head>
  <body>
    <noscript>WordSparrow requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
