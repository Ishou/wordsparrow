{{- if .Values.processCorrections.enabled -}}
{{/* Durable clue-correction backfill (ADR-0108 §4): runs `:grid:worker --process-corrections`, resuming on rows still matching. Same CNPG Secret + worker image as ensure-dailies; fetches the corpus (ADR-0097) because daily corrections and the ADR-0110 blocklist path regenerate grids (not a plain JSONB patch), so the worker builds a generation port at startup and needs CORPUS_DIR. */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wordsparrow-api.fullname" . }}-process-corrections
  labels: {{- include "wordsparrow-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: process-corrections
spec:
  schedule: {{ .Values.processCorrections.schedule | quote }}
  # Forbid: a second concurrent run would re-select and double-patch rows the first run is mid-flight on (ADR-0108 §4).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.processCorrections.activeDeadlineSeconds }}
      # No retries: the next scheduled run resumes on whatever rows still match.
      backoffLimit: 0
      template:
        metadata:
          labels: {{- include "wordsparrow-api.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: process-corrections
        spec:
          serviceAccountName: {{ include "wordsparrow-api.serviceAccountName" . }}
          restartPolicy: Never
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- if .Values.corpus.objectStore.enabled }}
          # ADR-0097: fetch the corpus from private object storage into a volume.
          initContainers:
            - name: fetch-corpus
              image: {{ include "wordsparrow-api.fetchCorpusImage" . | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                # MC_HOST_store keeps credentials out of this process's argv (unlike `mc alias set <user> <pass>`).
                - >
                  export MC_HOST_store="https://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@${S3_ENDPOINT#https://}" &&
                  mc cp --recursive "store/{{ .Values.corpus.objectStore.bucket }}/words" /corpus/
              env:
                - {name: S3_ENDPOINT, value: {{ .Values.corpus.objectStore.endpoint | quote }}}
                - name: S3_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: {{ .Values.corpus.objectStore.secretName }}, key: access_key}}
                - name: S3_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: {{ .Values.corpus.objectStore.secretName }}, key: secret_key}}
                # /corpus is the only writable mount under readOnlyRootFilesystem — see volumeMounts below.
                - {name: MC_CONFIG_DIR, value: /corpus/.mc}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
                # mc's image defaults to root; the runAsNonRoot pod policy needs an explicit non-root UID (fsGroup 1000 keeps /corpus writable).
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - {name: corpus, mountPath: /corpus}
          {{- end }}
          containers:
            - name: worker
              image: {{ include "wordsparrow-api.workerImage" . | quote }}
              imagePullPolicy: {{ .Values.ensureDailies.image.pullPolicy }}
              securityContext: {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              command: ["/app/bin/grid-worker"]
              args: ["--process-corrections"]
              env:
                # CNPG-managed connection string (same key the api Deployment uses).
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "wordsparrow-api.pgClusterName" . }}-app
                      key: uri
                {{- with .Values.ensureDailies.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- if .Values.corpus.objectStore.enabled }}
                - {name: CORPUS_DIR, value: /corpus}
                {{- end }}
                {{- if .Values.edgePurge.enabled }}
                # ADR-0089 §5: a patched daily must purge its edge cache; without these the fix waits for the until-midnight TTL.
                - name: CLOUDFLARE_ZONE_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.edgePurge.secretName }}
                      key: zone-id
                      optional: true
                - name: CLOUDFLARE_PURGE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.edgePurge.secretName }}
                      key: token
                      optional: true
                {{- end }}
              {{- with .Values.processCorrections.resources }}
              resources: {{- toYaml . | nindent 16 }}
              {{- end }}
              # readOnlyRootFilesystem requires a writable /tmp (JVM PerfData etc).
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                {{- if .Values.corpus.objectStore.enabled }}
                - {name: corpus, mountPath: /corpus, readOnly: true}
                {{- end }}
          volumes:
            - {name: tmp, emptyDir: {}}
            {{- if .Values.corpus.objectStore.enabled }}
            - {name: corpus, emptyDir: {}}
            {{- end }}
{{- end }}
