# Rollout allowlist (ADR-0068): `deps:` = per-name source libs; `types:` = non-source dep-type classes matched against Renovate's dep-type:<type> PR label.
deps:
  - signoz
  - helm
types:
  - helm-chart        # helmv3 Chart.yaml subcharts
  - container-image   # Dockerfile FROM + infra/*/values.yaml image tags (datasource=docker)
  - github-action     # github-actions workflow pins
