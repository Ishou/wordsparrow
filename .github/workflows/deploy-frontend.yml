name: Deploy Frontend

# Implements ADR-0004 §3 (CI is the only deploy path) as amended by ADR-0090 (Workers static assets).
#
# Drafts are skipped to match the ADR-0001 §6a workflow's behavior and
# avoid burning deploys on work-in-progress branches.
#
# Path filter: only run when something this workflow can actually affect
# changed (frontend source, IaC, or the workflow itself). Keeps docs-only
# PRs off the deploy critical path. CLAUDE.md "CI target: under 5 minutes"
# is met today by avoiding work, not by parallelizing it harder.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'terraform/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'terraform/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      legacy_redirect:
        description: 'Publish the pages-legacy-redirect 301 stub to the legacy Pages project instead of deploying the Worker (ADR-0090 §3)'
        type: boolean
        default: false

# A second push to the same branch cancels the in-flight deploy of that
# branch — the newer commit wins. `cancel-in-progress` is safe here
# because Cloudflare's deploy is idempotent on the directory contents.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # github-script upserts the preview URL as a sticky PR comment.
  pull-requests: write
  # github-script registers the preview URL as a GitHub deployment environment.
  deployments: write

jobs:
  deploy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.legacy_redirect) && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11.7.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium for prerender
        # Prerender (ADR-0053) only serializes DOM to HTML — fonts are irrelevant, and
        # ubuntu-latest already ships chromium's shared libs, so --with-deps buys nothing.
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Build frontend
        # PR previews use build:preview (loads .env.preview → VITE_USE_MOCK_API=true)
        # so MSW intercepts Grid API calls instead of hitting production.
        # Push to main uses the standard build (no mock).
        #
        # Run from the frontend directory rather than `pnpm --filter frontend`
        # at the repo root: pnpm 11's pre-command install-check requires a
        # package.json or `pnpm-workspace.yaml` declaring `packages:` at the
        # cwd. The repo isn't a monorepo, so cd-ing in is simpler than
        # adding a root workspace manifest.
        working-directory: frontend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm build:preview
          else
            pnpm build
          fi

      - name: Post-build SEO assertions
        working-directory: frontend
        run: pnpm test:post-build

      - name: Bootstrap Worker if it does not exist yet
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `versions upload` refuses a never-deployed Worker, so the first PR run bootstraps the dark Worker once (ADR-0090).
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/wordsparrow-frontend")"
          case "$status" in
            200) echo "Worker exists; no bootstrap needed" ;;
            404) pnpm exec wrangler deploy ;;
            *) echo "::error::Unexpected HTTP $status checking Worker existence"; exit 1 ;;
          esac

      - name: Publish to Cloudflare Workers
        id: publish
        # wrangler-action v4.0.0 pinned by SHA (ADR-0090); the wrangler version comes from the frontend lockfile.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # PRs upload a version (preview URL, no traffic); main deploys.
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- workers-preview-url -->';
            const url = process.env.PREVIEW_URL || '(no preview URL emitted — check the publish step logs)';
            const body = `${marker}\n**Workers preview** (ADR-0090): ${url}\n\nDeployed from ${context.payload.pull_request.head.sha}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Register preview as a GitHub deployment
        # Surfaces the Workers preview as an Environment in the PR (the "View deployment" link Pages used to create for free; ADR-0090 only comments the URL).
        if: ${{ github.event_name == 'pull_request' && steps.publish.outputs.deployment-url != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              // Marks this env inactive automatically when the PR closes, so previews don't linger.
              transient_environment: true,
              production_environment: false,
              auto_merge: false,
              // Don't block on other checks — the preview is already published by this point.
              required_contexts: [],
              description: 'Cloudflare Workers preview (ADR-0090)',
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Preview deployed to Cloudflare Workers',
            });

      - name: Emit Lighthouse handoff artifact
        # ADR-0064: emit deployed URL for lighthouse.yml (preview URL on PR, wordsparrow.io on main).
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p lighthouse-handoff
          # Any non-PR deploy targets production, so audit the production host.
          if [ "$EVENT" != "pull_request" ]; then
            URL="https://wordsparrow.io"
          else
            URL="$DEPLOY_URL"
          fi
          {
            echo "url=$URL"
            echo "event=$EVENT"
            echo "pr=$PR_NUMBER"
            echo "sha=$COMMIT_SHA"
          } > lighthouse-handoff/handoff.txt

      - name: Upload Lighthouse handoff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-handoff
          path: lighthouse-handoff/handoff.txt
          retention-days: 1

  legacy-redirect:
    # ADR-0090 §3 grace-period 301 stub, published through CI per ADR-0004 §3 (never from a shell).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_redirect }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11.7.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Publish legacy redirect stub to Pages
        # wrangler warns that wrangler.jsonc is not a Pages config and ignores it; the stub dir is the deploy source.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy pages-legacy-redirect --project-name=bliss --branch=main

      - name: Emit Lighthouse handoff artifact
        # lighthouse.yml consumes a handoff from every Deploy Frontend run; production is the audit target here.
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p lighthouse-handoff
          {
            echo "url=https://wordsparrow.io"
            echo "event=workflow_dispatch"
            echo "pr="
            echo "sha=$COMMIT_SHA"
          } > lighthouse-handoff/handoff.txt

      - name: Upload Lighthouse handoff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-handoff
          path: lighthouse-handoff/handoff.txt
          retention-days: 1
