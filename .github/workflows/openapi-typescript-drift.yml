name: OpenAPI TypeScript Drift

# Implements ADR-0003 §8.2: regenerate the TypeScript clients from the
# bounded contexts' OpenAPI specs (`grid/api/openapi.yaml`,
# `game/api/openapi.yaml`, `identity/api/openapi.yaml`,
# `survey/api/openapi.yaml`) and fail the build if the committed generated
# files (`frontend/src/infrastructure/api/{grid,game,identity,survey}/types.ts`)
# differ from the regen output. Guarantees the committed generated code is
# always in sync with the spec — no drift slips through review.
#
# Contributors regenerate locally with `pnpm --filter frontend api:generate`
# (or `frontend/scripts/generate-api-client.sh`) after every spec change. See
# `CONTRIBUTING.md` ("OpenAPI") for the workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: regen-and-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0 — pinned per the manifesto's "Builds are
        # deterministic" rule applied to actions, matching pnpm/action-setup
        # below.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '11.7.0'
          run_install: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0 — SHA-pinned per manifesto.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate TypeScript client
        working-directory: frontend
        run: pnpm api:generate

      - name: Verify committed types match the spec
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
            frontend/src/infrastructure/api/grid/types.ts \
            frontend/src/infrastructure/api/game/types.ts \
            frontend/src/infrastructure/api/identity/types.ts \
            frontend/src/infrastructure/api/survey/types.ts; then
            echo "::error::A generated frontend/src/infrastructure/api/<context>/types.ts is out of sync with its OpenAPI spec."
            echo "::error::Fix: run 'cd frontend && pnpm api:generate' (or 'frontend/scripts/generate-api-client.sh') and commit the updated file(s)."
            exit 1
          fi
