name: Trivy Config Scan

# IaC misconfig scan (Helm, K8s, Terraform, Dockerfiles) per ADR-0065.

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'terraform/**'
      - '**/Dockerfile'
      - '.github/workflows/trivy-config.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'terraform/**'
      - '**/Dockerfile'
      - '.github/workflows/trivy-config.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SARIF dump covers all severities (Security-tab backlog); gate step
      # below fails only on CRITICAL per ADR-0065 §2. See build-and-push-image.yml
      # trivy-image-scan job comment for the underlying action quirk.
      - name: Trivy SARIF dump (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy gate (CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: '1'
          skip-setup-trivy: true
