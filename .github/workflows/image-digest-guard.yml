name: image-digest-guard

# Fails a PR when an infra image tag bumps but its pinned digest is left stale (a silent no-op); see scripts/image_digests/.

on:
  pull_request:
    paths:
      - 'infra/**/values.yaml'
      - 'infra/**/values-prod.yaml'
      - 'scripts/image_digests/**'
      - '.github/workflows/image-digest-guard.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**/values.yaml'
      - 'infra/**/values-prod.yaml'
      - 'scripts/image_digests/**'
      - '.github/workflows/image-digest-guard.yml'

permissions:
  contents: read

concurrency:
  group: image-digest-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine base ref to diff against
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_BRANCH"
            echo "ref=origin/$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "ref=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'
      - run: pip install pyyaml pytest
      - name: Unit tests (parse/merge/diff logic)
        run: python -m pytest scripts/image_digests -q
      - name: Verify every tag bump also bumped its pinned digest
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: python scripts/image_digests/check_pinned_digests.py "$BASE_REF" infra
