name: Deploy Platform (k8s)

# Continuous delivery for the cluster-level platform chart (infra/platform/):
# cert-manager, ingress-nginx, external-dns, CloudNativePG, hcloud-csi
# (ADR-0009 §3). Until now this chart had no CD — changes to
# infra/platform/** reached prod only via a manual `helm upgrade` from a
# workstation, the exact anti-pattern flagged on PR #1129. This routes the
# upgrade through CI instead.
#
# Trigger is `workflow_dispatch` ONLY (not push-on-main): the platform chart
# bundles cluster-wide operators where a bad subchart bump can take down
# ingress or cert issuance, so deploys are deliberate, not automatic. The
# `prod-platform` GitHub Environment lets a required-reviewer rule gate them.
#
# PREREQUISITES (one-time, see docs/deploy.md):
#   - `KUBECONFIG_PROD` repository secret — cluster kubeconfig with the
#     rewritten public IP (already used by deploy-api-k8s.yml).
#   - `LETSENCRYPT_EMAIL` repository variable — ACME contact for the
#     Let's Encrypt ClusterIssuer (kept out of git; the chart requires it).

on:
  workflow_dispatch:

concurrency:
  # Serialize platform deploys; never cancel a mid-flight helm upgrade
  # (a cancelled upgrade can strand the release in pending-upgrade).
  group: deploy-platform-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (platform)
    runs-on: ubuntu-latest
    # Cold path covers helm dep build + ingress-nginx/cert-manager rollout.
    timeout-minutes: 20
    environment:
      name: prod-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.1

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_DATA:-}" ]; then
            echo "::error::KUBECONFIG_PROD secret is not set; see docs/deploy.md"
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade --install (platform chart)
        env:
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${LETSENCRYPT_EMAIL:-}" ]; then
            echo "::error::LETSENCRYPT_EMAIL variable is not set; see docs/deploy.md"
            exit 1
          fi
          helm dependency build infra/platform/
          # --wait=legacy: helm v4.2.1 'watcher' wait burns the full --timeout on each before-hook-creation hook deletion (cert-manager hooks here) — helm/helm#32214.
          helm upgrade --install platform infra/platform/ \
            -n platform --create-namespace \
            -f infra/platform/values-prod.yaml \
            --set clusterIssuer.letsencrypt.email="$LETSENCRYPT_EMAIL" \
            --wait=legacy --timeout 15m
