name: Deploy Observability Dashboards

# Deploys SigNoz dashboards via helm upgrade; API key lives in the in-cluster Secret, not in CI.

on:
  push:
    branches: [main]
    paths:
      - 'infra/observability/dashboards/**'
      - '.github/workflows/deploy-observability-dashboards.yml'
  workflow_dispatch: {}

concurrency:
  # cancel-in-progress: false — mid-helm-install cancel can orphan the post-install Job.
  group: deploy-observability-dashboards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: helm upgrade --install bliss-signoz-dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0 — same SHA as deploy-api-k8s.yml + helm-lint.yml.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Helm
        # azure/setup-helm v5.0.1 — same SHA as deploy-api-k8s.yml + helm-lint.yml.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_DATA:-}" ]; then
            echo "::error::KUBECONFIG_PROD secret is not set; see docs/deploy.md"
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade --install
        run: |
          # helm v4.2.1 'watcher' wait burns the full --timeout on each before-hook-creation hook deletion (helm/helm#32214); hookOnly waits only for the post-upgrade Job that loads the config
          helm upgrade --install bliss-signoz-dashboards \
            ./infra/observability/dashboards \
            -n observability \
            --wait=hookOnly --timeout 5m
