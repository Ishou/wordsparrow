name: breaking-bump

# breaking-bump pipeline (ADR-0068): B<->C plan loop, statically unrolled to <=6 rounds.

on:
  issues:
    # labeled-only: both opened+labeled would double-fire; labeled is sufficient and carries the label name.
    types: [labeled]
  workflow_dispatch:
    # Hand-drive the pipeline (stub or live) against a scratch spine issue, no Renovate PR needed.
    inputs:
      issue_number:
        description: 'Spine issue number to run the pipeline against (stub or live)'
        required: true

concurrency:
  # Issue-number keying serialises reopened-label refires; cancel-in-progress:false so migrations always complete.
  group: breaking-bump-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write        # Agent D forks + pushes the claude branch
  pull-requests: write   # open the claude PR, close the Renovate PR
  issues: write          # post to + label the spine issue
  id-token: write

jobs:
  read-context:
    # Gate to breaking-bump-labelled issues, or any workflow_dispatch (hand-driven test).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'breaking-bump')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Single source of truth for the issue number across both triggers.
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    outputs:
      valid: ${{ steps.ctx.outputs.valid }}
      dep: ${{ steps.ctx.outputs.dep }}
      from: ${{ steps.ctx.outputs.from }}
      to: ${{ steps.ctx.outputs.to }}
      pr: ${{ steps.ctx.outputs.pr }}
      claude_branch: ${{ steps.ctx.outputs.claude_branch }}
      issue_number: ${{ env.ISSUE_NUMBER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'
      - run: pip install -r scripts/breaking-bump/requirements.txt
      - name: Resolve the issue body
        id: body
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > /tmp/issue-body.md
      - name: Parse the context block from the issue body
        id: ctx
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/breaking-bump")
          import issue, identity
          body = open("/tmp/issue-body.md").read()
          ctx = issue.parse_context_block(body)
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not ctx:
              # Stray breaking-bump label on a hand-made issue -> no-op the run.
              out.write("valid=false\n")
              sys.exit(0)
          dep, frm, to, pr = ctx["dep"], ctx["from"], ctx["to"], ctx["pr"]
          out.write("valid=true\n")
          out.write(f"dep={dep}\nfrom={frm}\nto={to}\npr={pr}\n")
          out.write(f"claude_branch={identity.claude_branch(dep, to)}\n")
          PY

  agent-a:
    needs: read-context
    if: needs.read-context.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEP: ${{ needs.read-context.outputs.dep }}
      FROM: ${{ needs.read-context.outputs.from }}
      TO: ${{ needs.read-context.outputs.to }}
      PR_NUMBER: ${{ needs.read-context.outputs.pr }}
      ISSUE_NUMBER: ${{ needs.read-context.outputs.issue_number }}
    outputs:
      gate_a_failed: ${{ steps.tripwire.outputs.gate_a_failed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'
      - run: pip install -r scripts/breaking-bump/requirements.txt
      - name: Helm values-diff (helm bumps only)
        id: vdiff
        if: vars.BREAKING_BUMP_STUB != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP: ${{ needs.read-context.outputs.dep }}
          PR_NUMBER: ${{ needs.read-context.outputs.pr }}
        run: |
          set -euo pipefail
          # Find the chart this dep is bumped in from the Renovate PR's changed files.
          REN_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          git fetch origin "$REN_REF" main
          CHART=$(git diff --name-only "origin/main...origin/$REN_REF" \
                  | grep -E 'infra/.*/Chart\.yaml$' | head -n1 || true)
          if [ -z "$CHART" ]; then
            echo "::notice::no helm chart changed for $DEP — skipping values-diff."
            echo "helm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIR=$(dirname "$CHART")
          VALUES=$(ls "$DIR"/values.yaml 2>/dev/null || true)
          if [ -z "$VALUES" ]; then
            echo "::notice::chart $CHART has no values.yaml — no values-diff."
            echo "helm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --overrides is repeatable (argparse action="append"); one flag per file.
          OVERRIDE_ARGS=()
          for ov in "$DIR"/values-prod.yaml "$DIR"/values-*.yaml; do
            [ -f "$ov" ] && OVERRIDE_ARGS+=(--overrides "$ov")
          done
          git show "origin/main:$VALUES" > /tmp/values.old.yaml 2>/dev/null || echo '{}' > /tmp/values.old.yaml
          git show "origin/$REN_REF:$VALUES" > /tmp/values.new.yaml 2>/dev/null || cp "$VALUES" /tmp/values.new.yaml
          python scripts/breaking-bump/valuesdiff.py \
            --old /tmp/values.old.yaml --new /tmp/values.new.yaml \
            "${OVERRIDE_ARGS[@]+"${OVERRIDE_ARGS[@]}"}" > /tmp/valuesdiff.json
          echo "helm=true" >> "$GITHUB_OUTPUT"
          echo "::notice::values-diff written for $CHART"
      - name: Run Agent A (doc gatherer)
        id: agent
        if: vars.BREAKING_BUMP_STUB != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'renovate[bot],github-actions[bot]'
          # A NEVER reads our code: WebFetch/WebSearch + read the registry + post to the issue. No repo write.
          claude_args: '--allowed-tools "Read,Write,WebFetch,WebSearch,Bash(gh pr view:*),Bash(gh issue comment:*)"'
          prompt: |
            Read .github/breaking-bump/prompts/agent-a.md and follow it exactly.
            Substitute DEP=${{ env.DEP }}, FROM=${{ env.FROM }}, TO=${{ env.TO }},
            PR_NUMBER=${{ env.PR_NUMBER }}, ISSUE_NUMBER=${{ env.ISSUE_NUMBER }}.
            Write the A->B schema to ./abschema.json and post a human-readable
            enrichment comment to the spine issue.
      - name: STUB Agent A
        if: vars.BREAKING_BUMP_STUB == 'true'
        run: cp scripts/breaking-bump/stub_fixtures/abschema.json ./abschema.json
      - name: Update spend ledger (agent-a)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: agent-a
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          set -euo pipefail
          LINE=$(python scripts/breaking-bump/spend.py line "$STAGE" "$EXECUTION_FILE")
          MARKER='<!-- breaking-bump-spend-ledger -->'
          # Observability must never fail the migration; resolve the NUMERIC comment id via REST (gh issue view's .id is a GraphQL node id that 404s the REST PATCH).
          {
            CID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
                    --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty" | head -1)
            if [ -z "$CID" ]; then
              printf '' | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body \
                | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" -F body=@-
            fi
          } || echo "::warning::spend ledger update failed (non-fatal) for $STAGE"
      - name: Validate schema + zero-doc tripwire
        id: tripwire
        run: |
          set -euo pipefail
          test -f ./abschema.json || : > ./abschema.json
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/breaking-bump")
          import abparse
          doc, errors = abparse.load_schema("./abschema.json")
          gate_a = bool(errors) or abparse.zero_docs(doc)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"gate_a_failed={'true' if gate_a else 'false'}\n")
          if errors:
              print("::warning::A->B schema invalid: " + "; ".join(errors))
          PY
      - name: Upload A's schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abschema
          path: ./abschema.json
          retention-days: 3
      - name: Gate A — fail the run when A produced no usable contract
        if: steps.tripwire.outputs.gate_a_failed == 'true'
        run: |
          echo "::error::Gate A: Agent A fetched no usable docs (or emitted an invalid schema)."
          exit 1

  b_round1:
    needs: [read-context, agent-a]
    if: needs.read-context.outputs.valid == 'true' && needs.agent-a.outputs.gate_a_failed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEP: ${{ needs.read-context.outputs.dep }}
      FROM: ${{ needs.read-context.outputs.from }}
      TO: ${{ needs.read-context.outputs.to }}
      ISSUE_NUMBER: ${{ needs.read-context.outputs.issue_number }}
    outputs:
      gate_a_failed: ${{ steps.rate.outputs.gate_a_failed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.14.6' }
      - run: pip install -r scripts/breaking-bump/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: abschema, path: . }
      - name: Run Agent B (planner) — round 1
        id: agent
        if: vars.BREAKING_BUMP_STUB != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          # B reads our code + A's schema + posts to the issue. No repo write, no PR/branch ops.
          claude_args: '--allowed-tools "Read,Glob,Grep,Write,Bash(gh issue comment:*)"'
          prompt: |
            Read .github/breaking-bump/prompts/agent-b.md and follow it exactly.
            Substitute DEP=${{ env.DEP }}, FROM=${{ env.FROM }}, TO=${{ env.TO }},
            ISSUE_NUMBER=${{ env.ISSUE_NUMBER }}. A's schema is ./abschema.json
            (no ./prev-findings.json this round). First write /tmp/abrating.txt
            (rate A), then ./plan.json (the categorized plan).
      - name: STUB Agent B (round 1)
        if: vars.BREAKING_BUMP_STUB == 'true'
        run: |
          cp scripts/breaking-bump/stub_fixtures/abrating.txt /tmp/abrating.txt
          cp scripts/breaking-bump/stub_fixtures/plan.round1.json ./plan.json
      - name: Update spend ledger (b_round1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: b_round1
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          set -euo pipefail
          LINE=$(python scripts/breaking-bump/spend.py line "$STAGE" "$EXECUTION_FILE")
          MARKER='<!-- breaking-bump-spend-ledger -->'
          # Observability must never fail the migration; resolve the NUMERIC comment id via REST (gh issue view's .id is a GraphQL node id that 404s the REST PATCH).
          {
            CID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
                    --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty" | head -1)
            if [ -z "$CID" ]; then
              printf '' | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body \
                | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" -F body=@-
            fi
          } || echo "::warning::spend ledger update failed (non-fatal) for $STAGE"
      - name: Consumer-rated Gate A (B rates A)
        id: rate
        run: |
          set -euo pipefail
          RATING="$(head -n1 /tmp/abrating.txt 2>/dev/null | tr -d '[:space:]' || true)"
          echo "B's rating of A: '${RATING:-<none>}'"
          case "$RATING" in
            high|medium) echo "gate_a_failed=false" >> "$GITHUB_OUTPUT" ;;
            *)           echo "gate_a_failed=true"  >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Upload plan (round 1)
        if: steps.rate.outputs.gate_a_failed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: plan-round1, path: ./plan.json, retention-days: 3 }
      - name: Gate A — B judged A insufficient
        if: steps.rate.outputs.gate_a_failed == 'true'
        run: |
          echo "::error::Gate A (consumer-judged): B rated A's context insufficient to plan."
          exit 1

  c_round1:
    needs: [read-context, b_round1]
    if: needs.read-context.outputs.valid == 'true' && needs.b_round1.outputs.gate_a_failed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEP: ${{ needs.read-context.outputs.dep }}
      FROM: ${{ needs.read-context.outputs.from }}
      TO: ${{ needs.read-context.outputs.to }}
      ISSUE_NUMBER: ${{ needs.read-context.outputs.issue_number }}
      ROUND_NO: '1'
    outputs:
      approved: ${{ steps.decide.outputs.approved }}
      terminated: ${{ steps.decide.outputs.terminated }}
      findings_hash: ${{ steps.decide.outputs.findings_hash }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.14.6' }
      - run: pip install -r scripts/breaking-bump/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: abschema, path: . }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: plan-round1, path: . }
      - name: Run Agent C (plan reviewer) — round 1
        id: agent
        if: vars.BREAKING_BUMP_STUB != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          # C reads the plan + A's schema + the repo (to verify grounding), posts the verdict. No write.
          claude_args: '--allowed-tools "Read,Glob,Grep,Write,Bash(gh issue comment:*)"'
          prompt: |
            Read .github/breaking-bump/prompts/agent-c.md and follow it exactly.
            Substitute DEP=${{ env.DEP }}, FROM=${{ env.FROM }}, TO=${{ env.TO }},
            ISSUE_NUMBER=${{ env.ISSUE_NUMBER }}. Inputs: ./abschema.json,
            ./plan.json. Write the verdict to ./prev-findings.json.
      - name: STUB Agent C
        if: vars.BREAKING_BUMP_STUB == 'true'
        run: cp scripts/breaking-bump/stub_fixtures/findings.round1.json ./prev-findings.json
      - name: Decide loop state (approved / terminated / hash)
        id: decide
        env:
          PREV_HASH: ''   # round 1 has no prior findings
        run: |
          set -euo pipefail
          test -f ./prev-findings.json || echo '{"approved":false,"findings":[]}' > ./prev-findings.json
          python - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, "scripts/breaking-bump")
          import abparse, loop
          verdict = abparse.load_verdict("./prev-findings.json")
          keys = abparse.finding_keys(verdict)
          curr_hash = hashlib.sha256("\n".join(keys).encode()).hexdigest()
          prev_hash = os.environ.get("PREV_HASH", "")
          identical = bool(prev_hash) and prev_hash == curr_hash
          approved = loop.c_approved(verdict)
          done, _ = loop.loop_done(approved, identical, int(os.environ["ROUND_NO"]), 6)
          terminated = done and not approved
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"approved={'true' if approved else 'false'}\n")
          out.write(f"terminated={'true' if terminated else 'false'}\n")
          out.write(f"findings_hash={curr_hash}\n")
          PY
      - name: Update spend ledger (c_round1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: c_round1
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          set -euo pipefail
          LINE=$(python scripts/breaking-bump/spend.py line "$STAGE" "$EXECUTION_FILE")
          MARKER='<!-- breaking-bump-spend-ledger -->'
          # Observability must never fail the migration; resolve the NUMERIC comment id via REST (gh issue view's .id is a GraphQL node id that 404s the REST PATCH).
          {
            CID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
                    --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty" | head -1)
            if [ -z "$CID" ]; then
              printf '' | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body \
                | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" -F body=@-
            fi
          } || echo "::warning::spend ledger update failed (non-fatal) for $STAGE"
      - name: Upload findings (round 1)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: findings-round1, path: ./prev-findings.json, retention-days: 3 }

  b_round2:
    needs: [read-context, b_round1, c_round1]
    if: needs.read-context.outputs.valid == 'true' && needs.c_round1.outputs.approved == 'false' && needs.c_round1.outputs.terminated == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEP: ${{ needs.read-context.outputs.dep }}
      FROM: ${{ needs.read-context.outputs.from }}
      TO: ${{ needs.read-context.outputs.to }}
      ISSUE_NUMBER: ${{ needs.read-context.outputs.issue_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.14.6' }
      - run: pip install -r scripts/breaking-bump/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: abschema, path: . }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: findings-round1, path: . }
      - name: Run Agent B (planner) — round 2
        id: agent
        if: vars.BREAKING_BUMP_STUB != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          # B reads our code + A's schema + posts to the issue. No repo write, no PR/branch ops.
          claude_args: '--allowed-tools "Read,Glob,Grep,Write,Bash(gh issue comment:*)"'
          prompt: |
            Read .github/breaking-bump/prompts/agent-b.md and follow it exactly.
            Substitute DEP=${{ env.DEP }}, FROM=${{ env.FROM }}, TO=${{ env.TO }},
            ISSUE_NUMBER=${{ env.ISSUE_NUMBER }}. A's schema is ./abschema.json
            and Agent C's prior findings are ./prev-findings.json — address each.
            First write /tmp/abrating.txt (rate A), then ./plan.json (the
            categorized plan).
      - name: STUB Agent B (later round)
        if: vars.BREAKING_BUMP_STUB == 'true'
        run: cp scripts/breaking-bump/stub_fixtures/plan.round1.json ./plan.json
      - name: Update spend ledger (b_round2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: b_round2
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          set -euo pipefail
          LINE=$(python scripts/breaking-bump/spend.py line "$STAGE" "$EXECUTION_FILE")
          MARKER='<!-- breaking-bump-spend-ledger -->'
          # Observability must never fail the migration; resolve the NUMERIC comment id via REST (gh issue view's .id is a GraphQL node id that 404s the REST PATCH).
          {
            CID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
                    --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty" | head -1)
            if [ -z "$CID" ]; then
              printf '' | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CID" --jq .body \
                | python scripts/breaking-bump/spend.py body "$LINE" \
                | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" -F body=@-
            fi
          } || echo "::warning::spend ledger update failed (non-fatal) for $STAGE"
      - name: Upload plan (round 2)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: plan-round2, path: ./plan.json, retention-days: 3 }

  c_round2:
    needs: [read-context, b_round2, c_round1]
    if: needs.read-context.outputs.valid == 'true' && needs.b_round2.result == 'success' && needs.c_round1.outputs.approved == 'false' && needs.c_round1.outputs.terminated == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEP: ${{ needs.read-context.outputs.dep }}
      FROM: ${{ needs.read-context.outputs.from }}
      TO: ${{ needs.read-context.outputs.to }}
      ISSUE_NUMBER: ${{ needs.read-context.outputs.issue_number }}
      ROUND_NO: '2'
    outputs:
      approved: ${{ steps.decide.outputs.approved }}
      terminated: ${{ steps.decide.outputs.terminated }}
      findings_hash: ${{ steps.decide.outputs.findings_hash }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 1 }
