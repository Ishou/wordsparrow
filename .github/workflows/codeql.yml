name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            needs-jdk: true
            build-mode: autobuild
          - language: javascript-typescript
            needs-jdk: false
            # JS/TS extractor does not support autobuild; sources are indexed directly.
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        if: matrix.needs-jdk
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      # CodeQL's autobuild knows how to invoke Gradle for Kotlin projects
      # without a setup-gradle action restoring caches that make `assemble`
      # a no-op (which is what defeated the previous manual-mode attempt:
      # cached classes meant zero compiler invocations for the tracer to
      # capture). Autobuild is GitHub's recommended path for Java/Kotlin
      # and runs the build under CodeQL's tracer end-to-end.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          category: /language:${{ matrix.language }}
