# Shared defaults. Per-env files override what differs.
image:
  # GHCR image built by the sibling image-build pipeline.
  repository: ghcr.io/ishou/bliss/wordsparrow-billing-api
  # Required by manifesto ("pin to digest"). Empty -> tag fallback. Format "sha256:...".
  digest: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  # Overridden to true in values-prod.yaml so helm install/upgrade aborts
  # when CD forgot to inject the digest.
  requireDigest: false
# Billing keeps no in-memory state (subscriptions in Postgres, ADR-0078);
# the user.deleted consumer is a durable JetStream consumer so replicas
# share one delivery. Default 2; values-local drops to 1.
replicaCount: 2
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 1000m, memory: 512Mi}
database:
  # Wires BILLING_DATABASE_URL from the sibling CNPG cluster (chart
  # `billing/api/deploy/db-chart/`, Helm release `wordsparrow-billing-api-pg`)
  # and the wait-for-postgres init container. Off by default so local-dev
  # `helm install` against k3d boots without a Cluster; prod turns this on.
  enabled: false
  # CNPG cluster name. Equals the db chart's Helm release name; the
  # operator-managed `<clusterName>-app` Secret and `<clusterName>-rw`
  # Service names resolve from this.
  clusterName: "wordsparrow-billing-api-pg"
  # Image used by the wait-for-postgres init container. Duplicated from
  # db-chart/values.yaml so the init container reuses the node-cached
  # CNPG postgres image without depending on db-chart at render time.
  waitImage: "ghcr.io/cloudnative-pg/postgresql:18.4-system-bookworm@sha256:8707614e5941638307d173469b293db1b50e36454d321a03ca402ca2a58c79ad"
service:
  type: ClusterIP
  # Prod listens on 8083. grid 8080, game 8081, identity 8082, survey 7780.
  # Main.kt default (8083) matches; chart pins BILLING_PORT=8083 via env below.
  port: 8083
ingress:
  enabled: true
  className: nginx
  # REQUIRED per env (billing.wordsparrow.io prod, localhost local).
  host: ""
  # TLS Secret name created by cert-manager from the ingress annotation.
  tlsSecretName: ""
  # Env files set cert-manager and external-dns annotations here.
  annotations: {}
serviceAccount:
  create: true
  name: ""
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
probes:
  liveness:
    path: "/v1/health"
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: "/v1/health"
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  # 30 × 5 s = 150 s startup budget covers Flyway migration + Ktor boot.
  startup:
    path: "/v1/health"
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
# Mollie checkout return + webhook URLs. Required by MollieConfig.fromEnv at
# boot; set per env (prod -> frontend host + billing host, local -> localhost).
# MOLLIE_API_KEY is NOT here — it is a secret supplied via envFromSecret.
checkout:
  successUrl: ""
  cancelUrl: ""
  webhookUrl: ""
# Inline env vars. Prefer envFromSecret for anything sensitive (MOLLIE_API_KEY).
# OpenJDK MaxRAMPercentage default 25 -> ~128 MB on 512Mi; 75% -> ~384 MB heap.
env:
  # `-javaagent:/app/otel.jar` activates the OpenTelemetry Java agent baked
  # into the runtime image (Dockerfile §"Stage 2"). ADR-0027.
  - name: JAVA_TOOL_OPTIONS
    value: "-javaagent:/app/otel.jar -XX:MaxRAMPercentage=75.0"
  # Pin prod port; Main.kt default is 8083.
  - name: BILLING_PORT
    value: "8083"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://observability-signoz-otel-collector.observability:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_SERVICE_NAME
    value: "billing-api"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "bounded_context=billing"
  - name: OTEL_TRACES_SAMPLER
    value: "parentbased_traceidratio"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
  # NATS JetStream URL for the SubscriptionChanged publisher and the durable
  # user.deleted consumer (ADR-0049). `bliss-nats` is the cluster-internal
  # Service installed by the wordsparrow-nats chart in the `wordsparrow` namespace.
  - name: NATS_URL
    value: "nats://bliss-nats.wordsparrow:4222"
  # Identity-api base URL for session-cookie verification (billing:subscribe gate).
  - name: IDENTITY_API_URL
    value: "http://wordsparrow-identity-api.wordsparrow:8082"
  # Mollie checkout currency; amount/description/interval default in MollieConfig.
  - name: BILLING_CHECKOUT_CURRENCY
    value: "EUR"
# Name of a Kubernetes Secret to envFrom into the pod. ADR-0009 §10:
# bootstrapped via `kubectl create secret`, never committed. Carries
# MOLLIE_API_KEY (test_… / live_…). Bootstrap recipe lands with the prod cutover.
envFromSecret: ""
