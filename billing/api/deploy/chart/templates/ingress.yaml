{{- if .Values.ingress.enabled -}}
{{- if not .Values.ingress.host -}}
{{- fail "ingress.host must be set (see values-prod.yaml / values-local.yaml)" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bliss-billing-api.fullname" . }}
  labels: {{- include "bliss-billing-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Host-isolated (billing.wordsparrow.io), so routes at `/`. This
          # exposes the public `/v1/webhook` Mollie calls; its only auth is the
          # service's re-fetch-by-id of the referenced Mollie resource (ADR-0078).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bliss-billing-api.fullname" . }}
                port: {number: {{ .Values.service.port }}}
{{- end }}
