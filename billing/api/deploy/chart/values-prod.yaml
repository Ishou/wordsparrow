# Production overrides — Hetzner k3s cluster (ADR-0009 §2); no in-memory state (ADR-0078).

# Pins K8s name to release name so CD's kubectl rollout status resolves without chart-name arithmetic.
fullnameOverride: "wordsparrow-billing-api"

# ADR-0101 R5: 2 replicas for HA — billing has no in-memory state (ADR-0078), safe to scale regardless of GA status.
replicaCount: 2
image:
  # Fail-fast guard: helm aborts if digest is empty (see _helpers.tpl).
  requireDigest: true
  # Set by the CD workflow per push (ADR-0009 §8 step 5). Format "sha256:...".
  digest: ""
database:
  # CNPG cluster in sibling Helm release wordsparrow-billing-api-pg; deployed first by the workflow.
  enabled: true
checkout:
  # Frontend return paths (sibling frontend PR adds the routes).
  successUrl: "https://wordsparrow.io/abonnement/succes"
  cancelUrl: "https://wordsparrow.io/abonnement/annule"
  # Public billing host Mollie POSTs delivery notifications to.
  webhookUrl: "https://billing.wordsparrow.io/v1/webhook"
ingress:
  host: "billing.wordsparrow.io"
  tlsSecretName: "bliss-billing-api-tls"
  # Cluster-installed per ADR-0009 §3; target pins Hetzner floating IP (ADR-0012).
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: "billing.wordsparrow.io"
    external-dns.alpha.kubernetes.io/target: "116.202.180.82"
    # Per-IP leaky-bucket rate limiting; parity with identity.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "30"
# Chatel pre-renewal notice scheduler (ADR-0094 §3). The billing-worker image is built by
# build-and-push-image.yml and its digest injected by deploy-api-k8s.yml; the CronJob sends
# nothing until an annual sub enters the pre-renewal window (and only when email.enabled).
renewalNotices:
  enabled: true
  image:
    # Fail-fast guard once enabled: helm aborts if digest is empty (see _helpers.tpl).
    requireDigest: true
    digest: ""
# Outbox drain (ADR-0094; art. L221-13 delivery duty): every 10 min, retries any legal email whose immediate send failed, guaranteeing eventual delivery. Reuses the renewalNotices worker image digest.
emailOutboxDrain:
  enabled: true
# Scheduled-non-renewal expiry sweep (CGV Art. 14.1, ADR-0078): daily, ends a résiliation at period_end so identity drops the user to FREE (status-based entitlement). Reuses the renewalNotices worker image digest; publishes to the same NATS as the api Deployment.
expireCancellations:
  enabled: true
# Legally-mandated durable-medium emails (ADR-0094 §1-2): contract confirmation, per-charge receipt, résiliation — live in prod. The outbox (above) guarantees delivery; an immediate send never blocks checkout/webhook/cancel.
email:
  enabled: true
# Dedicated Secret for the Brevo transactional API key (same value as identity); own lifecycle, survives an env-bag re-bootstrap.
brevoApiKeySecret: "bliss-brevo-api"
# Bootstrapped per ADR-0009 §10; carries MOLLIE_API_KEY (test_… during ADR-0078 test phase).
envFromSecret: "bliss-billing-api-env"
