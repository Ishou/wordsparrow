apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "bliss-billing-api-pg.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}
  # Explicit image pin — operator default drift between cnpg minors would otherwise schedule a PG-major upgrade on next reconcile. Mirrors the other contexts' db-charts.
  imageName: {{ .Values.cluster.imageName | quote }}
  bootstrap:
    initdb:
      database: {{ .Values.cluster.bootstrap.database }}
      owner: {{ .Values.cluster.bootstrap.owner }}
      # Owner credentials are NOT chart-supplied; cnpg generates the password at initdb and surfaces it on the auto-managed `<cluster>-app` Secret the api reads for BILLING_DATABASE_URL.
  storage:
    size: {{ .Values.cluster.storage.size }}
    {{- with .Values.cluster.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- if .Values.backups.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ printf "s3://%s/%s" .Values.backups.bucket .Release.Name | quote }}
      endpointURL: {{ .Values.backups.endpoint | quote }}
      # Bootstrapped via `kubectl create secret generic cnpg-backup-creds` per ADR-0009 §10; Object Lock retention lives with operator-config (ADR-0010 §3).
      s3Credentials:
        accessKeyId: {name: cnpg-backup-creds, key: ACCESS_KEY_ID}
        secretAccessKey: {name: cnpg-backup-creds, key: ACCESS_SECRET_KEY}
      wal: {compression: gzip}
    retentionPolicy: {{ .Values.backups.retentionPolicy | quote }}
  {{- end }}
