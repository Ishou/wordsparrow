# Production overrides — Hetzner k3s cluster (ADR-0009 §2).
cluster:
  # Single instance is intentional for the test-phase dark-launch (ADR-0078) on this node pool; bump to HA (2–3, ADR-0009 §3) when billing goes GA and the cluster has headroom.
  instances: 1
  storage: {size: 20Gi, storageClass: "hcloud-volumes"}
backups:
  enabled: true
  # ADR-0010 §1 (bucket created one-time per ADR-0010 §4); FSN1 endpoint per §2. destinationPath keys on the release name, so it never collides with another context's prefix.
  bucket: "bliss-cnpg-backups"
  endpoint: "https://fsn1.your-objectstorage.com"
