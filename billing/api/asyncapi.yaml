# Billing bounded-context event contract.
#
# Hand-written AsyncAPI 2.6 per ADR-0003 §5 (source of truth, not generated
# from handler annotations). Wire conventions per ADR-0003 §6: UUID v7 ids,
# ISO-8601 instants with offset, camelCase, string enums.
#
# AsyncAPI 2.6 (not 3.x): it is the version Spectral's
# `@asyncapi/spectral-ruleset` is stable on, and 3.x reshapes operations
# (channel-as-resource) in ways that complicate codegen here (ADR-0019).
#
# This is a NATS domain-event subject (ADR-0049 posture), modelled on
# identity's UserRoleChanged (ADR-0060): billing emits SubscriptionChanged;
# identity consumes it and derives capabilities (ADR-0078 amendment).
asyncapi: 2.6.0
info:
  title: Bliss Billing Events API
  version: 0.1.0
  description: |
    Domain events emitted by the billing/ bounded context (ADR-0078). billing
    publishes `SubscriptionChanged` whenever a user's subscription transitions
    (created, renewed, canceled, or moved to pending_cancellation). billing
    knows only `userId` and subscription state — never capabilities. identity
    consumes this event and maps `(role + subscription) → capabilities`
    (ADR-0078 / ADR-0060 amendments); the frontend reads capabilities from
    identity's `/me`, never billing.

    The subject is internal (NetworkPolicy-guarded per ADR-0078) and carries no
    secrets. Mirrors the `UserRoleChanged` propagation shape (ADR-0060) over the
    NATS posture (ADR-0049).
  contact: { name: Bliss maintainers, url: https://github.com/Ishou/bliss, email: noreply@bliss.example }
  license: { name: FSL-1.1-MIT, url: https://github.com/Ishou/bliss/blob/main/LICENSE }

tags:
  - { name: subscription, description: Subscription-state propagation; identity derives capabilities from it. }

servers:
  production:
    url: nats.wordsparrow.io:4222
    protocol: nats
    description: Placeholder host; the canonical NATS URL stabilizes when the billing chart lands (ADR-0078).

defaultContentType: application/json

channels:
  wordsparrow.user.subscription-changed:
    description: |
      NATS subject carrying `SubscriptionChanged` events. Published by billing
      on every subscription transition; consumed by identity, which maps
      `(role + subscription) → capabilities` and enforces gates server-side.
    subscribe:
      operationId: publishSubscriptionChanged
      summary: A subscription transition was emitted by billing.
      description: |
        Emitted whenever a user's subscription changes (created, renewed,
        canceled, pending_cancellation). Consumers SHOULD treat the event as
        last-write-wins keyed by `userId`, applying newer `changedAt` over older
        cached state, and dedupe by `eventId` (delivery is at-least-once, so the
        same event may arrive more than once).
      tags:
        - { name: subscription }
      message:
        $ref: '#/components/messages/SubscriptionChanged'

components:
  messages:
    SubscriptionChanged:
      name: subscriptionChanged
      title: Subscription changed
      summary: A user's subscription transitioned; identity re-derives capabilities.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionChangedPayload'

  schemas:
    SubscriptionChangedPayload:
      type: object
      required: [eventId, userId, tier, status, periodEnd, source, changedAt]
      description: |
        Subscription transition for one user; carries NO capabilities (identity
        derives those). `periodEnd` is always on the wire and `null` when no
        current period applies — absence and `null` are distinct per ADR-0003
        §6. `tier`/`status` are open strings (not enums): the offer is
        config-driven and deferred (ADR-0078).

        v1 assumes a SINGLE subscription source per user (Mollie). When a second
        source lands (Play/Apple) a user could hold subscriptions from more than
        one source; the cross-source resolution rule (which source wins, how
        events from different sources reconcile) is NOT defined here and MUST be
        settled in an ADR-0078 amendment before the second adapter ships —
        last-write-wins by `changedAt` is safe only within a single source.
      properties:
        eventId:
          type: string
          format: uuid
          description: |
            UUID v7 of this emission (ADR-0003 §6). Stable per event so
            consumers dedupe idempotently under at-least-once delivery; distinct
            from `userId`.
          example: 0190e3b1-2c3d-7e4f-8a1b-2c3d4e5f6a7b
        userId:
          type: string
          format: uuid
          description: UUID v7 of the user whose subscription changed (ADR-0003 §6).
          example: 0190e3a4-7a2c-7c9e-8f1a-9b2d3e4f5a6b
        tier:
          type: string
          minLength: 1
          maxLength: 64
          description: Stored subscription tier after the transition. Open string, not an enum (ADR-0078).
          example: supporter
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: Subscription status after the transition (e.g. active, pending_cancellation, canceled). Open string, not an enum.
          example: active
        periodEnd:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 instant the current paid period ends, or `null` when no current period applies.
          example: '2026-07-29T00:00:00Z'
        source:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Billing source that produced the transition (e.g. mollie, play,
            apple). Source-tagged from day one so store adapters slot in
            without retrofit (ADR-0078). Open string, not an enum.
          example: mollie
        changedAt:
          type: string
          format: date-time
          description: ISO-8601 instant the transition occurred; consumers order by it (last-write-wins).
          example: '2026-06-29T15:30:00Z'
