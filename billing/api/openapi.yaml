# Billing bounded-context HTTP contract.
#
# Hand-written OpenAPI 3.1 per ADR-0003 §1 (source of truth, not generated
# from controller annotations). Wire conventions per ADR-0003 §6: UUID v7 ids,
# ISO-8601 instants with offset, camelCase, RFC 7807 errors, string enums.
# Context ratified by ADR-0078 (subscription foundation). billing knows only
# userId + subscription state, never capabilities — identity owns those
# (ADR-0078 / ADR-0060 amendments).
#
# v1 surface: hosted-checkout entry, the provider webhook, and the caller's
# subscription read. Tier and status are open strings, not enums: the free/paid
# offer is deliberately deferred (ADR-0078) — adding a tier is a config change,
# not a wire-breaking schema change.
openapi: 3.1.0
info:
  title: Bliss Billing API
  version: 1.0.0
  summary: Subscription checkout, provider webhook, and subscription read.
  description: |
    The Billing bounded context owns subscription lifecycle and exposes the
    caller's own subscription status (ADR-0078). It knows only `userId` and
    subscription state — never capabilities, which identity owns (ADR-0078 /
    ADR-0060 amendments). v1 exposes a hosted-checkout entry, the provider
    webhook callback, and a read of the caller's current subscription.

    No card data ever crosses this surface (PCI SAQ A): checkout is a redirect
    to the provider's hosted page. See `docs/adr/0003-cross-language-api-contract.md`
    for wire conventions and `docs/adr/0078-billing-subscription-context.md` for
    the subscription architecture and threat model.
  contact:
    name: Bliss maintainers
    url: https://github.com/Ishou/bliss
    email: noreply@bliss.example
  license:
    name: FSL-1.1-MIT
    url: https://github.com/Ishou/bliss/blob/main/LICENSE

servers:
  - url: https://api.bliss.example/billing
    description: Placeholder; the URL stabilizes when the billing chart lands
      (hosting decision deferred per ADR-0003 §Notes).

tags:
  - name: checkout
    description: |
      Hosted-checkout entry. Starts a provider checkout session for the
      authenticated caller; `userId` is derived from the session, never the
      request body (no subscribe-as-another-user, ADR-0078 threat model).
  - name: subscription
    description: |
      Read and manage the caller's own subscription (status read, cancel) for
      the manage-subscription UI. billing carries no capabilities — identity
      derives those (ADR-0078 / ADR-0060 amendments). Updating the payment
      method is deferred (no hosted portal on the initial provider, ADR-0078).
  - name: webhook
    description: |
      Public provider callback. The body is provider-opaque on this surface;
      the adapter authenticates every callback (signature verify or
      re-fetch-by-id) and parses the real shape (ADR-0078).

paths:
  /v1/checkout-session:
    post:
      operationId: createCheckoutSession
      summary: Start a hosted provider checkout session.
      description: |
        Creates a provider checkout session for the requested `tier` at the
        chosen billing `cadence` (`monthly` — 2 €/mois — or `yearly` —
        20 €/an, ADR-0080) and returns the hosted-checkout redirect plus the
        success / cancel return URLs. The client picks only the cadence; the
        price and provider billing interval are resolved server-side from it.
        The caller is identified by the `__Secure-ws_session` cookie; `userId`
        is resolved server-side and is NEVER read from the request body (no
        subscribe-as-another-user / IDOR, ADR-0078 threat model).

        No card data crosses this surface — the returned `checkoutUrl` is the
        provider's hosted page (PCI SAQ A).
      tags: [checkout]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '201':
          description: |
            Checkout session created. Body carries the hosted-checkout URL the
            client redirects to, plus the success and cancel return URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          description: |
            Request is malformed — missing or unknown `tier` or `cadence`.
            RFC 7807 body; `type` is
            `https://bliss.example/errors/invalid-checkout-request`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: |
            No valid `__Secure-ws_session` cookie. The session is missing,
            unparseable, or revoked. RFC 7807;
            `type` is `https://bliss.example/errors/auth-required`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            Authenticated caller lacks the `billing:subscribe` capability this
            endpoint requires (ADR-0078 / ADR-0060 amendments). RFC 7807;
            `type` is `https://bliss.example/errors/forbidden`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The caller already has an active subscription. Opening a second
            checkout session risks a duplicate provider subscription and double
            billing; cancel or manage the existing one instead. RFC 7807;
            `type` is `https://bliss.example/errors/already-subscribed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            Too many checkout-session attempts in the window. RFC 7807;
            `type` is `https://bliss.example/errors/rate-limited`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            The payment provider is unavailable, so no checkout session could be
            created; the caller may retry later. RFC 7807;
            `type` is `https://bliss.example/errors/provider-unavailable`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/subscription/cancel:
    post:
      operationId: cancelSubscription
      summary: Cancel the caller's active subscription.
      description: |
        Cancels the authenticated caller's active subscription at the provider.
        The caller is identified by the `__Secure-ws_session` cookie; `userId`
        is resolved server-side. Cancellation stops future renewals; whether
        access continues until `periodEnd` is a domain/provider decision
        reflected in the returned status (no refund/proration is implied here).

        Updating the payment method is intentionally NOT part of v1 — the
        initial provider (Mollie) has no hosted management portal and a mandate
        refresh is a provider-specific flow to design later (ADR-0078 deferral).
      tags: [subscription]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: |
            Cancellation accepted. Body is the caller's updated subscription
            (status reflects the cancellation; `periodEnd` is retained while a
            paid period remains).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionView'
        '401':
          description: |
            No valid `__Secure-ws_session` cookie. RFC 7807;
            `type` is `https://bliss.example/errors/auth-required`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            Authenticated caller lacks the `billing:subscribe` capability this
            endpoint requires (ADR-0078 / ADR-0060 amendments). RFC 7807;
            `type` is `https://bliss.example/errors/forbidden`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            The caller has no active subscription to cancel. RFC 7807;
            `type` is `https://bliss.example/errors/no-active-subscription`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            The payment provider is unavailable, so the cancellation could not
            be confirmed; the caller may retry later. RFC 7807;
            `type` is `https://bliss.example/errors/provider-unavailable`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/webhook:
    post:
      operationId: receiveProviderWebhook
      summary: Receive a provider webhook callback.
      description: |
        Public, unauthenticated-at-the-edge endpoint for provider callbacks.
        The body is provider-opaque on this surface: the contract models only a
        resource-reference `id`, sent as `application/x-www-form-urlencoded`
        (the initial provider, Mollie, posts `id=...` with no signature header);
        the real provider payload shape is parsed in the adapter, NOT here
        (ADR-0078 — provider shapes never leak past infrastructure). The adapter
        authenticates every callback (verify the provider signature where one
        exists, else re-fetch the resource by `id`) before trusting it — an
        unauthenticated body never grants entitlement.

        The adapter authenticates, applies, and durably records the event
        BEFORE returning 200: the provider treats any 2xx as final delivery and
        will not retry, so the work must complete (or be durably enqueued)
        before the acknowledgement, never after it.
      tags: [webhook]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: |
            Callback authenticated, applied, and durably recorded. Empty body.
            Returned only after the event is safely persisted, since the
            provider treats any 2xx as final delivery and will not retry.
        '400':
          description: |
            Body is missing or unparseable (no resource reference `id`).
            RFC 7807; `type` is
            `https://bliss.example/errors/invalid-webhook-body`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/subscription:
    get:
      operationId: getSubscription
      summary: Read the caller's own subscription status.
      description: |
        Returns the authenticated caller's subscription status — the stored
        `tier`, subscription `status`, and the current-period end (when one
        applies) — for the manage-subscription UI. The caller is identified by
        the `__Secure-ws_session` cookie; `userId` is resolved server-side.

        Carries no capabilities: identity owns authorization and derives
        capabilities from `(role + subscription)` (ADR-0078 / ADR-0060
        amendments).
      tags: [subscription]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Subscription resolved for the authenticated caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionView'
        '401':
          description: |
            No valid `__Secure-ws_session` cookie. RFC 7807;
            `type` is `https://bliss.example/errors/auth-required`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/receipts:
    get:
      operationId: listReceipts
      summary: List the caller's own payment receipts.
      description: |
        Returns the authenticated caller's payment receipts, newest-first, for
        a receipts list on `/compte` mirroring the manage-subscription panel
        — this PR's own proposal, not yet a ratified ADR-0080 decision. The
        caller is identified by the `__Secure-ws_session` cookie; `userId` is
        resolved server-side.

        These are the payment provider's records surfaced as opaque references
        (ADR-0078): the provider (Mollie) is the system-of-record for the
        underlying invoice and its PII. This surface carries only the
        non-identifying facts needed to render a list — when a payment
        happened, how much, its status, and a link to the provider's hosted
        receipt. It NEVER carries email, customer name, address, or card data;
        those never leave the provider.

        A subscriber accrues one receipt per billing cycle for as long as they
        stay subscribed, so the list is unbounded over a long enough
        subscription. Paginated cursor-first per ADR-0003 §6: pass `cursor`
        (the previous response's `nextCursor`) to fetch the next page.
      tags: [subscription]
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: cursor
          required: false
          description: |
            Opaque pagination cursor from a previous response's `nextCursor`.
            Omit to fetch the first page.
          schema:
            type: string
            minLength: 1
        - in: query
          name: limit
          required: false
          description: Max receipts to return. Defaults to 20; clamped to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: |
            Receipts resolved for the authenticated caller. The page is sorted
            newest-first and may be empty (a caller who never paid, or the
            last page of a longer history).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptsView'
        '401':
          description: |
            No valid `__Secure-ws_session` cookie. RFC 7807;
            `type` is `https://bliss.example/errors/auth-required`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-ws_session
      description: |
        Identity-api session cookie. The server verifies it against
        identity-api's whoami endpoint and resolves the calling user's
        `userId`. Missing or revoked cookies produce a 401
        `auth-required` response on protected operations.

  schemas:
    CheckoutSessionRequest:
      type: object
      description: |
        Request body for `POST /v1/checkout-session`. Carries the target `tier`,
        optionally the billing `cadence` (monthly or yearly), and the
        pre-contractual `consent` (CGV acceptance + Art. 13 waiver, ADR-0094);
        `userId` is session-derived and intentionally NOT part of the body
        (ADR-0078 threat model).
      required: [tier]
      properties:
        tier:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Target subscription tier. Open string, not an enum: the tier set is
            config-driven and deliberately deferred (ADR-0078). An unknown tier
            is rejected with a 400.
          example: supporter
        cadence:
          type: string
          enum: [monthly, yearly]
          x-enum-varnames: [MONTHLY, YEARLY]
          description: |
            Billing cadence the caller chose: `monthly` or `yearly` (ADR-0080,
            2 €/mois · 20 €/an). The client picks only the cadence, never the
            amount — the concrete price and the provider billing interval are
            selected server-side from the cadence. Optional for this expand
            phase (ADR-0078: no client-supplied amounts crossing this surface;
            CLAUDE.md expand-and-contract): the frontend cadence-selection
            consumer has not landed yet, so existing callers omit it and the
            server defaults to `monthly`. Will move to `required` once that
            consumer PR ships. An unknown value is rejected with a 400.
          example: monthly
        consent:
          $ref: '#/components/schemas/CheckoutConsent'

    CheckoutConsent:
      type: object
      description: |
        Pre-contractual consent captured at checkout for French consumer-law
        conformity (ADR-0094; CGV Art. 1, 7, 13). The server records it with the
        acceptance timestamp and binds it to the subscription; the durable-medium
        confirmation email reflects it. Optional for this expand phase
        (expand-and-contract): the frontend consent UI has not landed yet, so
        existing callers omit it. Once that consumer ships, a checkout without
        `consent` is rejected with a 400 and this moves toward required.
      required: [cgvAccepted, cgvVersion, withdrawalWaiver]
      properties:
        cgvAccepted:
          type: boolean
          description: |
            The consumer ticked the dedicated « j'accepte les CGV » box (CGV
            Art. 1 / 7). Must be `true`; `false` is rejected with a 400 — the
            contract cannot form without CGV acceptance.
          example: true
        cgvVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Version identifier of the exact CGV text shown and accepted (e.g.
            `1.0`), so the recorded consent is bound to a specific contract
            version. Echoed from what the client rendered; stored with the
            consent.
          example: "1.0"
        withdrawalWaiver:
          type: boolean
          description: |
            Art. L221-28 double-consent for immediate access (CGV Art. 13): the
            consumer expressly requested immediate performance AND acknowledged
            losing the 14-day droit de rétractation. `true` ⇒ access is immediate
            and the withdrawal right is lost at first delivery; `false` ⇒ the
            withdrawal right is preserved (access may be deferred). Recorded on
            durable medium.
          example: true

    CheckoutSessionResponse:
      type: object
      description: |
        Response body for `POST /v1/checkout-session` on a 201. The client
        redirects the browser to `checkoutUrl`; the provider returns the user
        to `successUrl` or `cancelUrl` after the hosted-checkout flow.
      required: [checkoutUrl, successUrl, cancelUrl]
      properties:
        checkoutUrl:
          type: string
          format: uri
          description: Provider-hosted checkout page to redirect the browser to.
          example: https://checkout.provider.example/s/abc123
        successUrl:
          type: string
          format: uri
          description: Return URL the provider sends the user to on success.
          example: https://wordsparrow.io/abonnement/merci
        cancelUrl:
          type: string
          format: uri
          description: Return URL the provider sends the user to on cancel.
          example: https://wordsparrow.io/abonnement

    WebhookEvent:
      type: object
      additionalProperties: true
      description: |
        Provider webhook body. Intentionally models only the resource
        reference `id`; the real provider shape is parsed in the adapter, which
        authenticates every callback (signature verify or re-fetch-by-id)
        before trusting it.
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Opaque provider resource reference. The adapter re-fetches the
            resource by this id to authenticate the callback rather than
            trusting the body.
          example: tr_WDqYK6vllg

    SubscriptionView:
      type: object
      description: |
        The caller's own subscription status. Carries no capabilities — identity
        owns those (ADR-0078 / ADR-0060 amendments). `periodEnd` is always
        present on the wire and `null` when no current period applies (e.g. free
        tier or a never-subscribed user) — absence and `null` are distinct per
        ADR-0003 §6.
      required: [tier, status, periodEnd]
      properties:
        tier:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Stored subscription tier. Open string, not an enum: the tier set is
            config-driven and deferred (ADR-0078).
          example: free
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Subscription status (e.g. active, pending_cancellation, canceled).
            Open string, not an enum, for the same forward-compatibility reason
            as `tier`.
          example: active
        periodEnd:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 instant the current paid period ends, or `null` when no
            current period applies.
          example: '2026-07-29T00:00:00Z'

    ReceiptsView:
      type: object
      description: |
        One page of the caller's own payment receipts, newest-first.
        `receipts` is always present on the wire and is an empty
        array when the caller has never paid, or when this is the last page
        — absence and an empty list are distinct per ADR-0003 §6. Cursor
        pagination per ADR-0003 §6: pass `nextCursor` as the next request's
        `cursor` to fetch the following page.
      required: [receipts, nextCursor]
      properties:
        receipts:
          type: array
          maxItems: 100
          description: |
            Up to `limit` receipts (default 20, max 100), sorted newest-first
            by `paidAt`. Empty for a caller who has never made a payment, or
            when there are no more receipts after `cursor`.
          items:
            $ref: '#/components/schemas/Receipt'
        nextCursor:
          type: string
          nullable: true
          description: |
            Opaque cursor for the next page, or `null` when this is the last
            page. Always present on the wire; `null` is the explicit
            "no more pages" value — absence and `null` are distinct per
            ADR-0003 §6.
          example: eyJwYWlkQXQiOiIyMDI2LTA1LTI5VDE0OjAzOjAwWiJ9

    Receipt:
      type: object
      description: |
        A single payment receipt: the provider's record surfaced as an opaque
        reference (ADR-0078). The provider (Mollie) is the system-of-record for
        the underlying invoice and its PII; this shape carries ONLY the
        non-identifying facts needed to render a list. It NEVER carries email,
        customer name, address, or card data — those never leave the provider.
      required: [paidAt, amountMinorUnits, currency, status, receiptUrl]
      properties:
        paidAt:
          type: string
          format: date-time
          description: ISO-8601 instant the payment was recorded by the provider.
          example: '2026-06-29T14:03:00Z'
        amountMinorUnits:
          type: integer
          minimum: 0
          description: |
            Amount charged, in integer minor units (cents) per ADR-0003 §6 —
            `200` for 2.00 EUR. The provider represents money as a decimal
            string; the billing adapter converts to minor units before this
            leaves the server. Paired with `currency`.
          example: 200
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code for `amountMinorUnits`.
          example: EUR
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Payment status (e.g. paid, pending, failed, refunded). Open string,
            not an enum, for the same forward-compatibility reason as the
            subscription's `tier`/`status`: the provider's status set is
            config-driven and may grow without a wire-breaking change.
          example: paid
        receiptUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Link to the provider's hosted receipt / PDF for this payment, or
            `null` when the provider exposes none for it. Always present on the
            wire; `null` is the explicit "no hosted receipt" value — absence and
            `null` are distinct per ADR-0003 §6.
          example: https://www.mollie.com/receipt/tr_WDqYK6vllg

    Problem:
      type: object
      description: |
        RFC 7807 error envelope (ADR-0003 §6). Additional members per
        RFC 7807 §3.2 may appear; clients tolerate them.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable URI for the error class. Clients route on `type`, never on
            `title` or `detail`.
          example: https://bliss.example/errors/auth-required
        title:
          type: string
          description: Short, human-readable summary of the error class.
          example: Authentication required
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code, repeated for clients that lose it.
          example: 401
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence.
