# Source registry for helm-bump enrichment (ADR-0067). Add an entry here when adding a subchart dep or pinned image.
modeA:
  - name: signoz
    repo: "https://charts.signoz.io"
    releaseNotes: "https://github.com/SigNoz/charts/releases/tag/signoz-{version}"
    extraDocs: "https://signoz.io/docs/operate/migration/"
  - name: k8s-infra
    repo: "https://charts.signoz.io"
    releaseNotes: "https://github.com/SigNoz/charts/releases/tag/k8s-infra-{version}"
    # version-specific; update to the matching guide when k8s-infra publishes one for the target release
    extraDocs: "https://signoz.io/docs/opentelemetry-collection-agents/k8s/k8s-infra/user-guides/upgrade-k8s-infra-v0-16/"
  - name: cert-manager
    repo: "https://charts.jetstack.io"
    releaseNotes: "https://github.com/cert-manager/cert-manager/releases/tag/v{version}"
    extraDocs: "https://cert-manager.io/docs/installation/upgrade/"
  - name: ingress-nginx
    repo: "https://kubernetes.github.io/ingress-nginx"
    releaseNotes: "https://github.com/kubernetes/ingress-nginx/releases/tag/helm-chart-{version}"
  - name: external-dns
    repo: "https://kubernetes-sigs.github.io/external-dns/"
    releaseNotes: "https://github.com/kubernetes-sigs/external-dns/releases/tag/external-dns-helm-chart-{version}"
  - name: cloudnative-pg
    repo: "https://cloudnative-pg.github.io/charts"
    releaseNotes: "https://github.com/cloudnative-pg/charts/releases/tag/cloudnative-pg-v{version}"
    extraDocs: "https://github.com/cloudnative-pg/cloudnative-pg/releases"
  - name: hcloud-csi
    repo: "https://charts.hetzner.cloud"
    releaseNotes: "https://github.com/hetznercloud/csi-driver/releases/tag/v{version}"
  # helm CLI (uses-with bump in CI), not a chart; modeA is where sources.py resolves it by name.
  - name: helm
    repo: "https://github.com/helm/helm"
    releaseNotes: "https://github.com/helm/helm/releases/tag/v{version}"
    extraDocs: "https://helm.sh/docs/changelog/"
modeB:
  - image: matomo
    releaseNotes: "https://matomo.org/changelog/"
    extraDocs: "https://github.com/matomo-org/matomo/releases"
    priority: high
  - image: mariadb
    releaseNotes: "https://mariadb.com/docs/release-notes/community-server/{series}/{version}"
    priority: high
  # floating minor pin (2.10-alpine): no per-patch tag, link to releases listing.
  - image: nats
    releaseNotes: "https://github.com/nats-io/nats-server/releases"
    extraDocs: "https://docs.nats.io/release-notes/whats_new"
    priority: high
  - image: natsio/nats-box
    releaseNotes: "https://github.com/nats-io/nats-box/releases"
    priority: low
  - image: natsio/prometheus-nats-exporter
    releaseNotes: "https://github.com/nats-io/prometheus-nats-exporter/releases"
    priority: low
