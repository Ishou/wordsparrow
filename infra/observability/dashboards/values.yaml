signoz:
  # cluster-internal; no Ingress, no oauth2-proxy bypass.
  url: "http://observability-signoz:8080"

apiKey:
  # Shared with sibling alerts chart; Secret data key must be 'apiKey'.
  secretName: signoz-alerts-apply-key

image:
  # same image as infra/nats bootstrap job; bundles curl+jq+sh.
  repository: natsio/nats-box
  tag: "0.19.7"
  digest: "sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
